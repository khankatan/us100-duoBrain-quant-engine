name: XAUUSD Quant Engine (FTMO 2Y Backtest)

on:
  workflow_dispatch:       # กดปุ่มสั่งรันเองบนหน้าเว็บ GitHub (ปิดการรันอัตโนมัติทุก 15 นาที)

permissions:
  contents: write

jobs:
  run-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install yfinance pandas numpy requests

      - name: Run Quant Calculation
        run: python quant_engine.py

      - name: Commit & Push Dashboard Data
        run: |
          git config user.name "Quant-Bot"
          git config user.email "bot@github.com"
          git add data/all_trades.csv data/state.json
          git commit -m "Update FTMO 2Y Backtest Results" || exit 0
          git push
